services:
  - type: web
    name: korfez-gezintisi
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: korfez-db
          property: connectionString
      - key: UPLOADS_DIR
        value: /opt/render/project/uploads
      - key: NODE_ENV
        value: production
    disk:
      name: uploads
      mountPath: /opt/render/project/uploads
      sizeGB: 1

databases:
  - name: korfez-db
    databaseName: korfez_db
    user: postgres
    plan: free
