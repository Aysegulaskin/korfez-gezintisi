<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="panel">

    <h1>Yönetici Paneli</h1>

    <input
        type="password"
        id="password"
        placeholder="Şifre">

    <button id="loginBtn">

        Giriş Yap

    </button>

    <div id="uploadArea" class="hidden">

        <h2>Fotoğraf Yükle</h2>

        <select id="regionSelect">

            <option value="kucukkuyu">Küçükkuyu</option>
            <option value="altinoluk">Altınoluk</option>
            <option value="gure">Güre</option>
            <option value="akcay">Akçay</option>
            <option value="ayvalik">Ayvalık</option>
            <option value="cunda">Cunda Adası</option>

        </select>

        <input
            type="text"
            id="placeTitle"
            placeholder="Yer Adı"
        />

        <textarea
            id="placeDescription"
            placeholder="Açıklama Yaz"
        ></textarea>

        <div id="dropZone">

            Fotoğrafı Buraya Sürükle

        </div>

        <input type="file" id="fileInput">

        <button id="uploadBtn">

            Yükle

        </button>

        <img id="preview">

    </div>

</div>

<script src="admin.js"></script>

</body>
</html>
